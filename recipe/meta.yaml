{% set name = "tftest" %}
{% set version = "1.8.8" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/tftest-{{ version }}.tar.gz
  sha256: 7e51e1bb817cfa4e2917af1c2407a85af0f8dbf33aee403884b9a14a40ab179f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.6
    - nose >=1.3
    - pip
  run:
    - python >=3.6

test:
  imports:
    - tftest
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/GoogleCloudPlatform/terraform-python-testing-helper
  summary: Simple Terraform test helper
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dangercrow
