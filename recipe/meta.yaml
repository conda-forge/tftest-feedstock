{% set name = "tftest" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/tftest-{{ version }}.tar.gz
  sha256: bcc714539f5016c689d0692979551fdce3f1a46ba13d3362712ce3c964a13b1d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.6
    - nose >=1.3
    - pip
  run:
    - python >=3.6

test:
  imports:
    - tftest
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/GoogleCloudPlatform/terraform-python-testing-helper
  summary: Simple Terraform test helper
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dangercrow
